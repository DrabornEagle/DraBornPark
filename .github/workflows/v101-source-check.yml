name: DraBornPark v1.0.1 Source Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'app.json'
      - '.github/VERSION'
      - '.github/workflows/v101-source-check.yml'
      - 'app/**'
      - 'src/**'
      - 'scripts/**'
      - 'assets/branding/v101/**'
      - 'supabase/migrations/20260824121000_dkd_drabornpark_v101_public_tag_links.sql'

permissions:
  contents: write

concurrency:
  group: drabornpark-v101-source-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync lockfile without Android build
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies and materialize brand assets
        run: npm install --no-audit --no-fund
      - name: Validate DraBornPark source
        run: |
          npm run check
          npx expo install --check
          npm run typecheck
          git diff --check
      - name: Persist package lock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync DraBornPark v1.0.1 package lock"
            git push origin HEAD:main
          fi
      - name: Confirm no Android artifacts were produced
        run: |
          test ! -d android/app/build/outputs || { echo "Unexpected Android build output" >&2; exit 1; }
          echo "Source validation complete. APK/AAB build intentionally skipped."
