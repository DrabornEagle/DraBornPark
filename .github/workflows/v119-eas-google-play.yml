name: DraBornPark v1.0.19 Local EAS Google Play Build

on:
  push:
    branches: [main]
    paths:
      - '.github/EAS_RELEASE_V119_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  DKD_EXPECTED_CERT_SHA256: "95:4C:F9:A8:E0:DB:09:46:A2:63:18:D6:95:7B:DF:0B:72:2D:51:7B:40:67:67:F8:3E:4C:37:BE:84:67:6B:C6"
  EAS_BUILD_NO_EXPO_GO_WARNING: "true"

jobs:
  build-signed-aab:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Materialize and validate v1.0.19
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npm ci --no-audit --no-fund
          npm run check
          npm run typecheck
          node -e "const a=require('./app.json').expo;if(a.version!=='1.0.19'||a.android.versionCode!==19)process.exit(1)"
          node -e "const p=require('./package.json');if(p.version!=='1.0.19')process.exit(1)"
          grep -F "const VERSION=\"1.0.19\"" supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F "FALLBACK_VERSION=\"1.0.19\"" supabase/functions/dkd-drabornpark-app-version/index.ts >/dev/null
          grep -F "AsyncStorage.removeItem('@drabornpark:plus-local-v118')" src/components/DraBornParkPlusPanel.tsx >/dev/null
          if grep -F "PLUS_LOCAL_CONFIRMED" src/components/DraBornParkPlusPanel.tsx >/dev/null; then echo 'Unsafe provisional entitlement remains' >&2; exit 1; fi
          if grep -F "dkdEstimatedExpiry" src/components/DraBornParkPlusPanel.tsx >/dev/null; then echo 'Unsafe local expiry estimate remains' >&2; exit 1; fi
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest project:info | tee /tmp/dkd-project.txt
          grep -F '@draborneagle/drabornpark' /tmp/dkd-project.txt
          grep -F 'db4ce418-3c4a-4323-9a1f-e39614b64e27' /tmp/dkd-project.txt

      - name: Sync materialized source if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.json package.json package-lock.json .github/VERSION app/index.tsx app/hub.tsx app/legal.tsx app/factory.tsx app/admin.tsx src/components/DraBornParkPlusPanel.tsx src/lib/drabornpark.ts supabase/functions/dkd-drabornpark-google-play/index.ts supabase/functions/dkd-drabornpark-app-version/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'release: materialize DraBornPark v1.0.19'
            git push origin HEAD:main || echo 'Source push skipped; validated working tree will still be built.'
          fi

      - name: Build signed production AAB locally with EAS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-output
          DKD_AAB="$PWD/signed-output/DraBornPark-v1.0.19-vc19-GooglePlay-release.aab"
          rm -f "$DKD_AAB"
          echo "Android SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unknown}}"
          npx --yes eas-cli@latest build --platform android --profile production --local --non-interactive --output "$DKD_AAB"
          test -s "$DKD_AAB"
          printf 'github-actions-local-eas\n' > /tmp/dkd-eas-id

      - name: Verify signed Google Play AAB
        shell: bash
        run: |
          set -euo pipefail
          DKD_BUILD_ID="$(cat /tmp/dkd-eas-id)"
          DKD_AAB="signed-output/DraBornPark-v1.0.19-vc19-GooglePlay-release.aab"
          test -s "$DKD_AAB"
          jarsigner -verify -verbose -certs "$DKD_AAB" | tee signed-output/JARSIGNER_VERIFY.txt
          grep -q 'jar verified.' signed-output/JARSIGNER_VERIFY.txt
          keytool -printcert -jarfile "$DKD_AAB" > signed-output/CERTIFICATE.txt
          DKD_CERT_SHA256="$(sed -n 's/^[[:space:]]*SHA256: //p' signed-output/CERTIFICATE.txt | head -n1 | tr '[:lower:]' '[:upper:]')"
          echo "Resolved upload certificate: $DKD_CERT_SHA256"
          if [ "$DKD_CERT_SHA256" != "$DKD_EXPECTED_CERT_SHA256" ]; then
            echo "Local EAS build was signed with an unexpected upload certificate." >&2
            exit 1
          fi
          DKD_SIG_COUNT="$(unzip -Z1 "$DKD_AAB" | grep -Ec '^META-INF/.*\.SF$')"
          test "$DKD_SIG_COUNT" -eq 1
          sha256sum "$DKD_AAB" | tee signed-output/SHA256SUMS.txt
          cat > signed-output/VERIFY.txt <<EOF
          DraBornPark v1.0.19 / versionCode 19 — Local EAS Google Play Signed Release
          Package: com.draborneagle.drabornpark
          Expo project: @draborneagle/drabornpark
          EAS Project ID: db4ce418-3c4a-4323-9a1f-e39614b64e27
          Firebase project: drabornpark
          Build path: $DKD_BUILD_ID
          Upload certificate SHA-256: $DKD_CERT_SHA256
          AAB signature blocks: $DKD_SIG_COUNT
          Billing client: server-authoritative entitlement; no fabricated 30/365-day expiry
          Billing restore: Google Play purchase token verified server-side before entitlement/finish
          Billing backend: SubscriptionPurchaseV2 + server acknowledgement for verified pending purchases
          jarsigner verification: PASS
          FINAL AAB RESULT: PASS
          EOF

      - name: Upload final signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0.19-vc19-GooglePlay-final
          path: signed-output/
          if-no-files-found: error
          retention-days: 14
