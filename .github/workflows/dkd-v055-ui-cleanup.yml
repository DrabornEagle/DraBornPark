name: DraBornPark v0.5.5 UI Cleanup

on:
  push:
    paths:
      - 'scripts/dkd_v055_ui_cleanup.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply requested UI cleanup
        run: node scripts/dkd_v055_ui_cleanup.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Integrity
        run: npm run check
      - name: TypeScript
        run: npm run typecheck
      - name: Commit
        run: |
          git config user.name 'DraBornPark UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/index.tsx 'app/feature/[slug].tsx' src/components/DraBornParkPlusPanel.tsx scripts/check-project.mjs
          git commit -m 'DraBornPark v0.5.5: simplify live and Plus UI'
          git pull --rebase origin main
          git push origin HEAD:main
