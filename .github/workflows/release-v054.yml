name: Release DraBornPark v0.5.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/apply-v054.mjs
      - scripts/fix-v054-type.mjs
      - scripts/fix-v054-worklets.mjs
      - .github/workflows/release-v054.yml

permissions:
  contents: write

concurrency:
  group: drabornpark-v054-release
  cancel-in-progress: true

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - id: apply
        name: Apply guarded v0.5.4 source changes
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/apply-v054.mjs 2>&1 | tee /tmp/v054-apply.log
          apply_code=${PIPESTATUS[0]}
          if [ "$apply_code" -eq 0 ]; then
            node scripts/fix-v054-type.mjs 2>&1 | tee /tmp/v054-typefix.log
            fix_code=${PIPESTATUS[0]}
            if [ "$fix_code" -eq 0 ]; then
              node scripts/fix-v054-worklets.mjs 2>&1 | tee /tmp/v054-worklets.log
              worklets_code=${PIPESTATUS[0]}
            else
              worklets_code=98
            fi
          else
            fix_code=99
            worklets_code=99
          fi
          echo "code=$apply_code" >> "$GITHUB_OUTPUT"
          echo "fix_code=$fix_code" >> "$GITHUB_OUTPUT"
          echo "worklets_code=$worklets_code" >> "$GITHUB_OUTPUT"
          test "$apply_code" -eq 0 -a "$fix_code" -eq 0 -a "$worklets_code" -eq 0
      - id: install
        name: Install exact dependencies
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund 2>&1 | tee /tmp/v054-install.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: integrity
        name: Integrity audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/v054-integrity.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: expo
        name: Expo dependency compatibility
        if: steps.integrity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx expo install --check 2>&1 | tee /tmp/v054-expo.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: types
        name: TypeScript
        if: steps.expo.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/v054-types.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: web
        name: Expo web export
        if: steps.types.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx expo export --platform web 2>&1 | tee /tmp/v054-web.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: source_commit
        name: Create validated source commit locally
        if: steps.web.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          rm -f scripts/fix-v054-type.mjs scripts/fix-v054-worklets.mjs .github/V054_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "DraBornPark v0.5.4: support, permissions and Google Play Plus"
          fi
      - id: android
        name: Build and verify v0.5.4 Developer APK
        if: steps.source_commit.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CI: '1'
        run: |
          set +e
          {
            npx expo prebuild --platform android --clean --no-install &&
            cd android && ./gradlew :app:assembleDebug --no-daemon && cd .. &&
            APK="android/app/build/outputs/apk/debug/app-debug.apk" &&
            test -f "$APK" &&
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)" &&
            "$AAPT" dump badging "$APK" | grep "package: name='com.draborneagle.drabornpark'" &&
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)" &&
            "$APKSIGNER" verify --verbose "$APK" &&
            mkdir -p artifacts &&
            cp "$APK" artifacts/DraBornPark-v0.5.4-vc20-developer-debug.apk &&
            sha256sum artifacts/DraBornPark-v0.5.4-vc20-developer-debug.apk > artifacts/SHA256.txt &&
            printf 'DraBornPark v0.5.4\nAndroid versionCode: 20\nBuild type: Expo Developer APK / debug\nMetro: npx expo start --dev-client --clear\nNative modules: expo-iap + expo-notifications\nGoogle Play product: drabornpark_plus\nBase plans: monthly / yearly\nWorklets: 0.12.1\n' > artifacts/BUILD_INFO.txt
          } 2>&1 | tee /tmp/v054-android.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Clean native generation before publish
        if: steps.android.outcome == 'success'
        run: rm -rf android
      - id: publish
        name: Publish validated v0.5.4 to main
        if: steps.android.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload v0.5.4 Developer APK artifact
        if: steps.android.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v0.5.4-vc20-developer-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Publish v0.5.4 Developer APK release asset
        if: steps.android.outcome == 'success' && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="v0.5.4-dev"
          APK="artifacts/DraBornPark-v0.5.4-vc20-developer-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" artifacts/SHA256.txt artifacts/BUILD_INFO.txt --clobber
          else
            gh release create "$TAG" "$APK" artifacts/SHA256.txt artifacts/BUILD_INFO.txt \
              --target main \
              --title "DraBornPark v0.5.4 Developer APK" \
              --notes "Doğrulanmış DraBornPark v0.5.4 Expo Developer APK. Android versionCode 20. TypeScript, Expo dependency check, web export, Android Gradle build, package adı ve APK imzası release workflow içinde doğrulanmıştır." \
              --prerelease
          fi
      - name: Publish failure diagnostic
        if: steps.apply.outcome != 'success' || steps.install.outcome == 'failure' || steps.integrity.outcome == 'failure' || steps.expo.outcome == 'failure' || steps.types.outcome == 'failure' || steps.web.outcome == 'failure' || steps.source_commit.outcome == 'failure' || steps.android.outcome == 'failure' || steps.publish.outcome == 'failure'
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          rm -rf android artifacts
          {
            echo "DraBornPark v0.5.4 release validation failed."
            echo "apply=${{ steps.apply.outcome }} code=${{ steps.apply.outputs.code }} fix_code=${{ steps.apply.outputs.fix_code }} worklets_code=${{ steps.apply.outputs.worklets_code }}"
            echo "install=${{ steps.install.outcome }} code=${{ steps.install.outputs.code }}"
            echo "integrity=${{ steps.integrity.outcome }} code=${{ steps.integrity.outputs.code }}"
            echo "expo=${{ steps.expo.outcome }} code=${{ steps.expo.outputs.code }}"
            echo "types=${{ steps.types.outcome }} code=${{ steps.types.outputs.code }}"
            echo "web=${{ steps.web.outcome }} code=${{ steps.web.outputs.code }}"
            echo "source_commit=${{ steps.source_commit.outcome }}"
            echo "android=${{ steps.android.outcome }} code=${{ steps.android.outputs.code }}"
            echo "publish=${{ steps.publish.outcome }}"
            echo
            for f in /tmp/v054-apply.log /tmp/v054-typefix.log /tmp/v054-worklets.log /tmp/v054-install.log /tmp/v054-integrity.log /tmp/v054-expo.log /tmp/v054-types.log /tmp/v054-web.log /tmp/v054-android.log; do
              if [ -f "$f" ]; then echo "===== $f ====="; tail -n 240 "$f"; echo; fi
            done
          } > .github/V054_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/V054_FAILURE.txt
          git commit -m "ci(v0.5.4): record release validation failure"
          git push origin HEAD:main
          exit 1
