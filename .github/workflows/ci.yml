name: DraBornPark CI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/**, feat/**, build/**, fix/**]
  pull_request:
    branches: [main]

concurrency:
  group: drabornpark-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Project integrity and production hygiene
        run: npm run check
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: TypeScript
        run: npm run typecheck
      - name: Expo web export
        run: npx expo export --platform web
      - name: Verify tracked source stayed clean
        run: git diff --exit-code -- .

  android-developer-apk:
    name: Android Developer APK
    needs: expo-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android development project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build Developer APK
        working-directory: android
        env:
          CI: '1'
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify Developer APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep "package: name='com.draborneagle.drabornpark'"
          "$AAPT" dump badging "$APK" | grep "versionCode='22'"
          "$AAPT" dump badging "$APK" | grep "versionName='0.5.6'"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Prepare Developer APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DraBornPark-v0.5.6-vc22-developer-debug.apk
          sha256sum artifacts/DraBornPark-v0.5.6-vc22-developer-debug.apk > artifacts/SHA256.txt
          printf 'DraBornPark v0.5.6\nAndroid versionCode: 22\nCommit: %s\nBuild type: Expo Developer APK / debug\nMetro required: yes\nRecommended Termux command: npx expo start --dev-client --clear\nNotification channel: drabornpark-alerts-v3\nGoogle Play privacy disclosures: v0.5.6\nFactory panel: admin-only\nRealtime home sync: isolated vehicle/tag channels\n' "${GITHUB_SHA}" > artifacts/BUILD_INFO.txt
      - name: Upload Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v0.5.6-vc22-developer-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
