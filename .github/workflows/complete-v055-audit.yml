name: DraBornPark v0.5.5 Completion Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-v055-audit.yml'

permissions:
  contents: write

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply audited v0.5.5 completion patch
        run: |
          node scripts/dkd_complete_v055.mjs
          rm scripts/dkd_complete_v055.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Project integrity
        run: npm run check

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript
        run: npm run typecheck

      - name: Web export
        run: npx expo export --platform web

      - name: Android prebuild
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Developer APK
        working-directory: android
        env:
          CI: '1'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify v0.5.5 Developer APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep "package: name='com.draborneagle.drabornpark'"
          "$AAPT" dump badging "$APK" | grep "versionCode='21'"
          "$AAPT" dump badging "$APK" | grep "versionName='0.5.5'"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/DraBornPark-v0.5.5-vc21-developer-debug-complete.apk
          sha256sum artifacts/DraBornPark-v0.5.5-vc21-developer-debug-complete.apk > artifacts/SHA256.txt
          printf 'DraBornPark v0.5.5 completion audit\nAndroid versionCode: 21\nPackage: com.draborneagle.drabornpark\nBuild: Developer APK / debug\nRealtime vehicle refresh: enabled\nPremium foreground popup: enabled\nWeb inline message + JPEG picker: enabled\nTag transfer pgcrypto fix: enabled\n' > artifacts/BUILD_INFO.txt

      - name: Commit validated completion source
        run: |
          git config user.name "DraBornPark Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A app src scripts README.md supabase/migrations
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "DraBornPark v0.5.5: complete requested UI and realtime fixes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload completed Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v0.5.5-vc21-developer-apk-complete
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
