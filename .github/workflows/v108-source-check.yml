name: DraBornPark v1.0.20 Source Check

on:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'google-services.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'
      - 'supabase/functions/dkd-drabornpark-google-play/index.ts'
      - 'supabase/functions/dkd-drabornpark-app-version/index.ts'
      - '.github/VERSION'
      - 'scripts/materialize-v120.mjs'
      - 'scripts/apply-v120-safe.mjs'
      - 'scripts/apply-v120-owned-card.mjs'
      - 'scripts/check-v120.mjs'
      - '.github/workflows/v108-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v120:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate DraBornPark v1.0.20
        run: npm run check
      - name: TypeScript check
        run: npm run typecheck
      - name: Validate Firebase Android native prebuild
        shell: bash
        run: |
          set -euo pipefail
          CI=1 npx expo prebuild --platform android --clean --no-install
          test -f android/app/google-services.json
          node -e "const f=require('./android/app/google-services.json');const packages=(f.client||[]).map(x=>x?.client_info?.android_client_info?.package_name);if(f.project_info?.project_id!=='drabornpark'||!packages.includes('com.draborneagle.drabornpark'))process.exit(1)"
          grep -R -F 'com.google.gms.google-services' android >/dev/null
          grep -R -F 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml >/dev/null
      - name: Verify v1.0.20 release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./app.json').expo.version")" = "1.0.20"
          test "$(node -p "require('./app.json').expo.android.versionCode")" = "20"
          test "$(node -p "require('./package.json').version")" = "1.0.20"
          grep -F 'const VERSION="1.0.20"' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'orderHistory?.refundEvent' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'effectiveEntitled=!refunded' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'urn:ietf:params:oauth:grant-type:jwt-bearer' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'visible={dkdInfoPopup}' src/components/DraBornParkPlusPanel.tsx >/dev/null
          grep -F 'dkdPaidPremium&&dkdOwnedPlanCardId===plan.id' src/components/DraBornParkPlusPanel.tsx >/dev/null
          if grep -F "Aylık ve yıllık güncel fiyatlar Google Play'den canlı alınır." src/components/DraBornParkPlusPanel.tsx >/dev/null; then exit 1; fi
          if grep -F 'PLUS_LOCAL_CONFIRMED' src/components/DraBornParkPlusPanel.tsx >/dev/null; then exit 1; fi
          test ! -d android/app/build/outputs/bundle
          test ! -d android/app/build/outputs/apk
          echo 'v1.0.20 source/native-config validation PASS'
