name: DraBornPark v1.0.21 Source Check

on:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'google-services.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/**'
      - 'src/**'
      - 'supabase/functions/dkd-drabornpark-google-play/index.ts'
      - 'supabase/functions/dkd-drabornpark-app-version/index.ts'
      - '.github/VERSION'
      - 'scripts/materialize-v121.mjs'
      - 'scripts/apply-v121-account-billing.mjs'
      - 'scripts/apply-v121-server-billing.mjs'
      - 'scripts/check-v121.mjs'
      - '.github/workflows/v108-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v121:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate DraBornPark v1.0.21
        run: npm run check
      - name: TypeScript check
        run: npm run typecheck
      - name: Validate Firebase Android native prebuild
        shell: bash
        run: |
          set -euo pipefail
          CI=1 npx expo prebuild --platform android --clean --no-install
          test -f android/app/google-services.json
          node -e "const f=require('./android/app/google-services.json');const packages=(f.client||[]).map(x=>x?.client_info?.android_client_info?.package_name);if(f.project_info?.project_id!=='drabornpark'||!packages.includes('com.draborneagle.drabornpark'))process.exit(1)"
          grep -R -F 'com.google.gms.google-services' android >/dev/null
          grep -R -F 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml >/dev/null
      - name: Verify v1.0.21 release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./app.json').expo.version")" = "1.0.21"
          test "$(node -p "require('./app.json').expo.android.versionCode")" = "21"
          test "$(node -p "require('./package.json').version")" = "1.0.21"
          grep -F 'const VERSION="1.0.21"' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'purchase_already_claimed' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'purchase_missing_account_binding' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'PLUS_OTHER_ACCOUNT' src/components/DraBornParkPlusPanel.tsx >/dev/null
          grep -F 'obfuscatedProfileId:obfuscated' src/components/DraBornParkPlusPanel.tsx >/dev/null
          grep -F 'v1.0.21' app/legal.tsx >/dev/null
          test ! -d android/app/build/outputs/bundle
          test ! -d android/app/build/outputs/apk
          echo 'v1.0.21 source/native-config validation PASS'
