name: DraBornPark Google Play Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/RELEASE_V101_TRIGGER'
  pull_request:
    branches: [main]
    paths:
      - '.github/RELEASE_V101_TRIGGER'

permissions:
  contents: write

concurrency:
  group: drabornpark-google-play-release-v101-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_UPLOAD_CERT_SHA256: '95:4C:F9:A8:E0:DB:09:46:A2:63:18:D6:95:7B:DF:0B:72:2D:51:7B:40:67:67:F8:3E:4C:37:BE:84:67:6B:C6'

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install aligned Expo SDK 57 dependencies
        env:
          CI: '1'
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Verify source and dependency policy
        env:
          CI: '1'
        run: |
          npm run check
          npx expo install --check
          npm run typecheck
          git diff --check
          ! grep -q 'expo-dev-client' package.json
          ! grep -q 'expo-dev-client' app.json

      - name: Persist aligned dependency lockfile
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Expo SDK 57 dependencies for v1.0.1"
            git push origin HEAD:main
          fi

      - name: Generate clean Android production project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated production manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          grep -F 'www.draborneagle.com' "$MANIFEST"
          grep -F '/DraBornPark/t/' "$MANIFEST"
          if grep -R -F 'exp+drabornpark' android/app/src/main; then
            echo 'Development exp+drabornpark scheme unexpectedly present' >&2
            exit 1
          fi
          if grep -R -F 'expo.modules.devclient' android/app/src/main; then
            echo 'Expo dev client marker unexpectedly present' >&2
            exit 1
          fi

      - name: Build production APK and AAB for secure signing
        working-directory: android
        env:
          CI: '1'
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify unsigned production package
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          AAB="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APK" && test -f "$APK"
          test -n "$AAB" && test -f "$AAB"
          "$AAPT" dump badging "$APK" | grep "package: name='com.draborneagle.drabornpark'"
          "$AAPT" dump badging "$APK" | grep "versionCode='2'"
          "$AAPT" dump badging "$APK" | grep "versionName='1.0.1'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'www.draborneagle.com'
          if "$AAPT" dump permissions "$APK" | grep -F 'android.permission.SYSTEM_ALERT_WINDOW'; then echo 'SYSTEM_ALERT_WINDOW present' >&2; exit 1; fi
          if "$AAPT" dump permissions "$APK" | grep -F 'android.permission.RECORD_AUDIO'; then echo 'RECORD_AUDIO present' >&2; exit 1; fi
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'exp+drabornpark'; then echo 'Development scheme present' >&2; exit 1; fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: Prepare secure-signing inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp "$APK" release-output/DraBornPark-v1.0.1-vc2-production-unsigned.apk
          cp "$AAB" release-output/DraBornPark-v1.0.1-vc2-production-unsigned.aab
          sha256sum release-output/* > release-output/SHA256SUMS.txt
          cat > release-output/BUILD_INFO.txt <<'EOF'
          DraBornPark Google Play production signing input
          Version name: 1.0.1
          Android versionCode: 2
          Package: com.draborneagle.drabornpark
          Expo SDK: 57
          React Native: 0.86.2
          expo-dev-client: absent
          SYSTEM_ALERT_WINDOW: verified absent
          RECORD_AUDIO: verified absent
          Android App Link: https://www.draborneagle.com/DraBornPark/t/*
          Expected upload certificate SHA-256: 95:4C:F9:A8:E0:DB:09:46:A2:63:18:D6:95:7B:DF:0B:72:2D:51:7B:40:67:67:F8:3E:4C:37:BE:84:67:6B:C6
          Final AAB is signed outside GitHub Actions with the permanent upload key and verified before distribution.
          EOF

      - name: Upload production secure-signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0.1-vc2-production-signing-inputs
          path: release-output/
          if-no-files-found: error
          retention-days: 7
