name: DraBornPark v1.0.22 Local EAS Google Play Build

on:
  push:
    branches: [main]
    paths:
      - '.github/EAS_RELEASE_V122_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  DKD_EXPECTED_CERT_SHA256: "95:4C:F9:A8:E0:DB:09:46:A2:63:18:D6:95:7B:DF:0B:72:2D:51:7B:40:67:67:F8:3E:4C:37:BE:84:67:6B:C6"
  EAS_BUILD_NO_EXPO_GO_WARNING: "true"

jobs:
  build-signed-aab:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Materialize and validate v1.0.22
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          npm ci --no-audit --no-fund
          npm run check
          npm run typecheck
          node -e "const a=require('./app.json').expo;if(a.version!=='1.0.22'||a.android.versionCode!==22)process.exit(1)"
          node -e "const p=require('./package.json');if(p.version!=='1.0.22')process.exit(1)"
          grep -F 'const VERSION="1.0.22"' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'dkd_v122' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'current_purchase_trial_snapshot' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          grep -F 'calculatedTrialDays=Math.min(14' supabase/functions/dkd-drabornpark-google-play/index.ts >/dev/null
          if grep -F 'previousUserBonus' supabase/functions/dkd-drabornpark-google-play/index.ts; then exit 1; fi
          if grep -F 'previousUserSubscription' supabase/functions/dkd-drabornpark-google-play/index.ts; then exit 1; fi
          grep -F 'SAHİP OLDUĞUN PLAN • Detayları gör' src/components/DraBornParkPlusPanel.tsx >/dev/null
          grep -F 'setDkdInfoPopup(true)' src/components/DraBornParkPlusPanel.tsx >/dev/null
          grep -F 'dkdPaidPremium?Math.floor' src/components/DraBornParkPlusPanel.tsx >/dev/null
          grep -F 'v1.0.22' app/legal.tsx >/dev/null
          npx --yes eas-cli@latest whoami
          npx --yes eas-cli@latest project:info | tee /tmp/dkd-project.txt
          grep -F '@draborneagle/drabornpark' /tmp/dkd-project.txt
          grep -F 'db4ce418-3c4a-4323-9a1f-e39614b64e27' /tmp/dkd-project.txt

      - name: Sync materialized source if needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.json package.json package-lock.json .github/VERSION app/index.tsx app/hub.tsx app/legal.tsx app/factory.tsx app/admin.tsx src/components/MandatoryUpdateGate.tsx src/components/DraBornParkPlusPanel.tsx supabase/functions/dkd-drabornpark-google-play/index.ts supabase/functions/dkd-drabornpark-app-version/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'release: materialize DraBornPark v1.0.22'
            git push origin HEAD:main || echo 'Source push skipped; validated working tree will still be built.'
          fi

      - name: Build signed production AAB locally with EAS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-output
          DKD_AAB="$PWD/signed-output/DraBornPark-v1.0.22-vc22-GooglePlay-release.aab"
          rm -f "$DKD_AAB"
          npx --yes eas-cli@latest build --platform android --profile production --local --non-interactive --output "$DKD_AAB"
          test -s "$DKD_AAB"

      - name: Verify signed Google Play AAB
        shell: bash
        run: |
          set -euo pipefail
          DKD_AAB="signed-output/DraBornPark-v1.0.22-vc22-GooglePlay-release.aab"
          jarsigner -verify -verbose -certs "$DKD_AAB" | tee signed-output/JARSIGNER_VERIFY.txt
          grep -q 'jar verified.' signed-output/JARSIGNER_VERIFY.txt
          keytool -printcert -jarfile "$DKD_AAB" > signed-output/CERTIFICATE.txt
          DKD_CERT_SHA256="$(sed -n 's/^[[:space:]]*SHA256: //p' signed-output/CERTIFICATE.txt | head -n1 | tr '[:lower:]' '[:upper:]')"
          test "$DKD_CERT_SHA256" = "$DKD_EXPECTED_CERT_SHA256"
          DKD_SIG_COUNT="$(unzip -Z1 "$DKD_AAB" | grep -Ec '^META-INF/.*\.SF$')"
          test "$DKD_SIG_COUNT" -eq 1
          sha256sum "$DKD_AAB" | tee signed-output/SHA256SUMS.txt
          cat > signed-output/VERIFY.txt <<EOF
          DraBornPark v1.0.22 / versionCode 22 — Google Play Signed Release
          Package: com.draborneagle.drabornpark
          Upload certificate SHA-256: $DKD_CERT_SHA256
          AAB signature blocks: $DKD_SIG_COUNT
          Billing: Google Play expiry is the authoritative paid entitlement boundary
          Billing: current purchase snapshots only the remaining DraBornPark tag reward, capped at 14 days
          Billing: another or refunded purchase token can no longer donate/reuse its trial reward
          Billing: the same purchase token never receives the tag reward twice
          Premium UI: owned plan card opens a modern animated entitlement information popup
          Premium UI: paid remaining-day counter uses full-day floor logic
          App/Web visible version: v1.0.22
          Android versionCode: 22
          jarsigner verification: PASS
          FINAL AAB RESULT: PASS
          EOF

      - name: Upload final signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0.22-vc22-GooglePlay-final
          path: signed-output/
          if-no-files-found: error
          retention-days: 14
