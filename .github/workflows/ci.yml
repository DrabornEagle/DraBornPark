name: DraBornPark CI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

concurrency:
  group: drabornpark-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Project integrity and release hygiene
        run: npm run check

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript
        run: npm run typecheck

      - name: Expo web export
        run: npx expo export --platform web

      - name: Verify tracked source stayed clean
        run: git diff --exit-code -- .

  developer-apk:
    name: Developer APK
    needs: expo-check
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'build/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare developer APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DraBornPark-v0.5.0-vc13-developer.apk
          sha256sum artifacts/DraBornPark-v0.5.0-vc13-developer.apk > artifacts/SHA256.txt
          printf 'DraBornPark v0.5.0\nAndroid versionCode: 13\nCommit: %s\nBuild type: Developer / debug APK\n' "${GITHUB_SHA}" > artifacts/BUILD_INFO.txt

      - name: Upload Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v0.5.0-vc13-developer-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
