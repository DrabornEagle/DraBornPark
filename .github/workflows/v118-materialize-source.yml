name: DraBornPark v1.0.18 Materialized Source

on:
  push:
    branches: [main]
    paths:
      - '.github/V118_MATERIALIZE_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-v118:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Materialize and validate v1.0.18
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          npm run typecheck
      - name: Commit materialized v1.0.18 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrabornEagle Release Bot'
          git config user.email 'draborneagle@gmail.com'
          git add app.json package-lock.json app/index.tsx app/hub.tsx app/legal.tsx app/factory.tsx app/admin.tsx src/components/DraBornParkPlusPanel.tsx supabase/functions/dkd-drabornpark-google-play/index.ts supabase/functions/dkd-drabornpark-app-version/index.ts
          if git diff --cached --quiet; then
            echo 'Materialized v1.0.18 source already committed.'
            exit 0
          fi
          git commit -m 'feat: materialize DraBornPark v1.0.18 source'
          git push origin HEAD:main
