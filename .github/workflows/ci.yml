name: DraBornPark CI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

concurrency:
  group: drabornpark-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Project integrity and release hygiene
        run: npm run check

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript
        run: npm run typecheck

      - name: Expo web export
        run: npx expo export --platform web

      - name: Verify tracked source stayed clean
        run: git diff --exit-code -- .
