name: DraBornPark CI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

concurrency:
  group: drabornpark-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Project integrity and release hygiene
        run: npm run check

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript
        run: npm run typecheck

      - name: Expo web export
        run: npx expo export --platform web

      - name: Verify tracked source stayed clean
        run: git diff --exit-code -- .

  developer-apk:
    name: Developer Standalone APK
    needs: expo-check
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'build/')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone APK with embedded JS bundle
        working-directory: android
        env:
          CI: '1'
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify standalone APK bundle and signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -E 'assets/(index\.android\.bundle|.*\.hbc)' >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare developer standalone APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/DraBornPark-v0.5.0-vc14-developer-standalone.apk
          sha256sum artifacts/DraBornPark-v0.5.0-vc14-developer-standalone.apk > artifacts/SHA256.txt
          printf 'DraBornPark v0.5.0\nAndroid versionCode: 14\nCommit: %s\nBuild type: Developer standalone / release variant\nJavaScript bundle: embedded\nMetro required: no\nPurpose: physical-device testing only\n' "${GITHUB_SHA}" > artifacts/BUILD_INFO.txt

      - name: Upload Developer Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v0.5.0-vc14-developer-standalone-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
