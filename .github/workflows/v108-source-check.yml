name: DraBornPark v1.0.10 Source Check

on:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'google-services.json'
      - 'package.json'
      - 'package-lock.json'
      - 'app/_layout.tsx'
      - 'src/lib/push.ts'
      - 'src/components/AppChrome.tsx'
      - 'src/components/DraBornParkPlusPanel.tsx'
      - 'src/components/MandatoryUpdateGate.tsx'
      - 'app/index.tsx'
      - 'app/factory.tsx'
      - 'supabase/functions/drabornpark-public-contact/index.ts'
      - 'supabase/functions/drabornpark-call-request/index.ts'
      - 'supabase/functions/dkd-drabornpark-admin-support-push/index.ts'
      - 'supabase/functions/dkd-drabornpark-google-play/index.ts'
      - 'supabase/functions/dkd-drabornpark-app-version/index.ts'
      - '.github/VERSION'
      - 'scripts/apply-v110-source-transform.mjs'
      - 'scripts/check-v110.mjs'
      - '.github/workflows/v108-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v110:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate DraBornPark v1.0.10
        run: npm run check
      - name: TypeScript check
        run: npm run typecheck
      - name: Validate Firebase Android native prebuild
        shell: bash
        run: |
          set -euo pipefail
          CI=1 npx expo prebuild --platform android --clean --no-install
          test -f android/app/google-services.json
          node -e "const f=require('./android/app/google-services.json');const packages=(f.client||[]).map(x=>x?.client_info?.android_client_info?.package_name);if(f.project_info?.project_id!=='drabornpark'||!packages.includes('com.draborneagle.drabornpark'))process.exit(1)"
          grep -R -F 'com.google.gms.google-services' android >/dev/null
          grep -R -F 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml >/dev/null
          echo "Firebase Android native prebuild OK — no APK/AAB generated."
      - name: Verify v1.0.10 release metadata
        run: |
          test "$(node -p "require('./app.json').expo.version")" = "1.0.10"
          test "$(node -p "require('./app.json').expo.android.versionCode")" = "10"
          test ! -d android/app/build/outputs/bundle
          test ! -d android/app/build/outputs/apk
          echo "v1.0.10 source/native-config validation complete; no APK/AAB build step exists in this workflow."
