name: DraBornPark v1.0.8 Expo EAS Auto Link

on:
  push:
    branches: [main]
    paths:
      - '.github/V108_EXPO_AUTOLINK_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  link-eas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Probe public Expo project metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dkd-expo-pages
          urls=(
            'https://expo.dev/accounts/draborneagle/projects/drabornpark'
            'https://expo.dev/accounts/draborneagle/projects/drabornpark/settings'
            'https://expo.dev/@draborneagle/drabornpark'
          )
          dkd_index=0
          for dkd_url in "${urls[@]}"; do
            dkd_index=$((dkd_index+1))
            dkd_file="/tmp/dkd-expo-pages/page-${dkd_index}.html"
            echo "PROBE ${dkd_url}"
            curl -L --compressed --max-time 25 -A 'Mozilla/5.0 DraBornPark-EAS-Link/1.0' -sS "$dkd_url" -o "$dkd_file" || true
            echo "bytes=$(wc -c < "$dkd_file" 2>/dev/null || echo 0)"
            grep -Eio '.{0,100}(DraBornPark|drabornpark|projectId|project_id).{0,180}' "$dkd_file" | head -n 12 || true
            grep -Eio '[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}' "$dkd_file" | sort -u | head -n 20 || true
          done
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const dir='/tmp/dkd-expo-pages';
          const uuid='[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}';
          const candidates=[];
          for(const file of fs.readdirSync(dir)){
            const text=fs.readFileSync(path.join(dir,file),'utf8');
            for(const re of [
              new RegExp(`(?:projectId|project_id)[^0-9a-f]{0,80}(${uuid})`,'ig'),
              new RegExp(`(${uuid})[^]{0,900}?(?:DraBornPark|drabornpark)`,'ig'),
              new RegExp(`(?:DraBornPark|drabornpark)[^]{0,900}?(${uuid})`,'ig')
            ]){
              let m;while((m=re.exec(text)))candidates.push(m[1].toLowerCase());
            }
          }
          const unique=[...new Set(candidates)];
          console.log('Public EAS candidate IDs:',unique);
          if(unique.length===1)fs.writeFileSync('/tmp/dkd-public-project-id',unique[0]+'\n');
          NODE
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve and link EAS Project ID
        shell: bash
        run: |
          set -euo pipefail
          dkd_public_id="$(cat /tmp/dkd-public-project-id 2>/dev/null || true)"
          dkd_id=""
          if [ -n "$dkd_public_id" ]; then
            echo "Using uniquely matched public Expo project ID: $dkd_public_id"
            dkd_id="$dkd_public_id"
          elif [ -n "${EXPO_TOKEN:-}" ]; then
            npx --yes eas-cli@latest init --account draborneagle --non-interactive --json > /tmp/dkd-eas-init.json
            cat /tmp/dkd-eas-init.json
            dkd_id="$(node - <<'NODE'
          const fs=require('fs');const data=JSON.parse(fs.readFileSync('/tmp/dkd-eas-init.json','utf8'));
          const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          function find(value){if(typeof value==='string'&&uuid.test(value))return value;if(value&&typeof value==='object')for(const [k,v] of Object.entries(value)){if(/project.?id|^id$/i.test(k)&&typeof v==='string'&&uuid.test(v))return v;const n=find(v);if(n)return n;}return null;}
          process.stdout.write(find(data)||'');
          NODE
          )"
          else
            echo 'Could not uniquely discover the existing project ID publicly, and no EXPO_TOKEN GitHub secret is available.' >&2
            exit 42
          fi
          export DKD_EAS_PROJECT_ID="$dkd_id"
          node <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          const id=process.env.DKD_EAS_PROJECT_ID;
          const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          if(!id||!uuid.test(id))throw new Error('Invalid EAS Project ID');
          app.expo.owner='draborneagle';
          app.expo.extra={...(app.expo.extra||{}),eas:{...((app.expo.extra||{}).eas||{}),projectId:id}};
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          fs.writeFileSync('.github/EAS_PROJECT_INFO.txt',`DraBornPark EAS Project\nOwner: draborneagle\nSlug: drabornpark\nProject ID: ${id}\nLinked: ${new Date().toISOString()}\n`);
          console.log('Resolved EAS Project ID:',id);
          NODE
      - name: Validate linked Expo configuration
        shell: bash
        run: |
          set -euo pipefail
          node -e "const a=require('./app.json');if(a.expo.owner!=='draborneagle'||a.expo.slug!=='drabornpark'||a.expo.android.package!=='com.draborneagle.drabornpark'||!a.expo.extra?.eas?.projectId)process.exit(1)"
          npx expo config --json > /tmp/dkd-expo-config.json
          node -e "const a=require('./app.json'),c=require('/tmp/dkd-expo-config.json');if(c.extra?.eas?.projectId!==a.expo.extra.eas.projectId)process.exit(1)"
          if [ -n "${EXPO_TOKEN:-}" ]; then
            npx --yes eas-cli@latest project:info
          fi
      - name: Verify project checks after linking
        run: |
          npm run check
          npm run typecheck
          npx expo prebuild --platform android --clean --no-install
          test -f android/app/google-services.json
          grep -F 'com.draborneagle.drabornpark' android/app/google-services.json
      - name: Commit Expo EAS link
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrabornEagle Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.json .github/EAS_PROJECT_INFO.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(v1.0.8): link DraBornPark to Expo EAS project'
          git push origin HEAD:main
