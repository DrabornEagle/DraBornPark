name: DraBornPark Google Play Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/RELEASE_V101_TRIGGER'

permissions:
  contents: write

concurrency:
  group: drabornpark-google-play-release-v101
  cancel-in-progress: false

env:
  EXPECTED_UPLOAD_CERT_SHA256: '95:4C:F9:A8:E0:DB:09:46:A2:63:18:D6:95:7B:DF:0B:72:2D:51:7B:40:67:67:F8:3E:4C:37:BE:84:67:6B:C6'

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install aligned Expo SDK 57 dependencies
        env:
          CI: '1'
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix

      - name: Verify source and dependency policy
        env:
          CI: '1'
        run: |
          npm run check
          npx expo install --check
          npm run typecheck
          git diff --check
          ! grep -q 'expo-dev-client' package.json
          ! grep -q 'expo-dev-client' app.json

      - name: Persist aligned dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Expo SDK 57 dependencies for v1.0.1"
            git push origin HEAD:main
          fi

      - name: Generate clean Android production project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated production manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          grep -F 'www.draborneagle.com' "$MANIFEST"
          grep -F '/DraBornPark/t/' "$MANIFEST"
          if grep -R -F 'exp+drabornpark' android/app/src/main; then
            echo 'Development exp+drabornpark scheme unexpectedly present' >&2
            exit 1
          fi
          if grep -R -F 'expo.modules.devclient' android/app/src/main; then
            echo 'Expo dev client marker unexpectedly present' >&2
            exit 1
          fi

      - name: Restore permanent Google Play upload key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DRABORNPARK_UPLOAD_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.DRABORNPARK_UPLOAD_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.DRABORNPARK_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DRABORNPARK_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Permanent upload keystore secret is missing' >&2; exit 1; }
          test -n "$STORE_PASS" || { echo 'Upload keystore password secret is missing' >&2; exit 1; }
          test -n "$KEY_PASS" || { echo 'Upload key password secret is missing' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Upload key alias secret is missing' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/drabornpark-signing"
          KEYSTORE="$RUNNER_TEMP/drabornpark-signing/upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          CERT_SHA="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          test "$CERT_SHA" = "$EXPECTED_UPLOAD_CERT_SHA256" || { echo "Wrong signing key fingerprint: $CERT_SHA" >&2; exit 1; }
          echo "DRABORNPARK_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "DRABORNPARK_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "DRABORNPARK_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "DRABORNPARK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // DraBornPark v1.0.1 Google Play production signing.
          android {
              signingConfigs {
                  drabornparkPlayRelease {
                      storeFile file(System.getenv("DRABORNPARK_KEYSTORE"))
                      storePassword System.getenv("DRABORNPARK_STORE_PASS")
                      keyAlias System.getenv("DRABORNPARK_KEY_ALIAS")
                      keyPassword System.getenv("DRABORNPARK_KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.drabornparkPlayRelease
                  }
              }
          }
          GRADLE

      - name: Build signed production APK and AAB
        working-directory: android
        env:
          CI: '1'
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify final production package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -f "$APK"
          test -f "$AAB"
          "$AAPT" dump badging "$APK" | grep "package: name='com.draborneagle.drabornpark'"
          "$AAPT" dump badging "$APK" | grep "versionCode='2'"
          "$AAPT" dump badging "$APK" | grep "versionName='1.0.1'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'www.draborneagle.com'
          if "$AAPT" dump permissions "$APK" | grep -F 'android.permission.SYSTEM_ALERT_WINDOW'; then echo 'SYSTEM_ALERT_WINDOW present' >&2; exit 1; fi
          if "$AAPT" dump permissions "$APK" | grep -F 'android.permission.RECORD_AUDIO'; then echo 'RECORD_AUDIO present' >&2; exit 1; fi
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'exp+drabornpark'; then echo 'Development scheme present' >&2; exit 1; fi
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          grep -F "$EXPECTED_UPLOAD_CERT_SHA256" /tmp/apk-signature.txt
          jarsigner -verify -verbose -certs "$AAB" | tee /tmp/aab-signature.txt
          grep -F 'jar verified.' /tmp/aab-signature.txt

      - name: Prepare v1.0.1 outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk release-output/DraBornPark-v1.0.1-vc2-GooglePlay-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-output/DraBornPark-v1.0.1-vc2-GooglePlay-release.aab
          sha256sum release-output/*.apk release-output/*.aab > release-output/SHA256SUMS.txt
          cat > release-output/BUILD_INFO.txt <<'EOF'
          DraBornPark Google Play production release
          Version name: 1.0.1
          Android versionCode: 2
          Package: com.draborneagle.drabornpark
          Expo SDK: 57
          React Native: 0.86.2
          expo-dev-client: absent
          SYSTEM_ALERT_WINDOW: verified absent
          RECORD_AUDIO: verified absent
          Android App Link: https://www.draborneagle.com/DraBornPark/t/*
          Signing certificate SHA-256: 95:4C:F9:A8:E0:DB:09:46:A2:63:18:D6:95:7B:DF:0B:72:2D:51:7B:40:67:67:F8:3E:4C:37:BE:84:67:6B:C6
          EOF

      - name: Upload signed Google Play release
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0.1-vc2-GooglePlay-signed-release
          path: release-output/
          if-no-files-found: error
          retention-days: 30
