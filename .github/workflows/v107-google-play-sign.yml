name: DraBornPark v1.0.7 Google Play Sign

on:
  workflow_run:
    workflows: ["DraBornPark v1.0.7 Google Play Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful v1.0.7 release workflow run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  sign-google-play-aab:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}
      DKD_EXPECTED_CERT_SHA256: "95:4C:F9:A8:E0:DB:09:46:A2:63:18:D6:95:7B:DF:0B:72:2D:51:7B:40:67:67:F8:3E:4C:37:BE:84:67:6B:C6"
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve source build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DKD_SOURCE_RUN_ID="${{ inputs.run_id }}"
          else
            DKD_SOURCE_RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          test -n "$DKD_SOURCE_RUN_ID"
          echo "DKD_SOURCE_RUN_ID=$DKD_SOURCE_RUN_ID" >> "$GITHUB_ENV"

      - name: Download verified unsigned v1.0.7 build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signing-input
          gh run download "$DKD_SOURCE_RUN_ID" --repo "${GITHUB_REPOSITORY}" --name "DraBornPark-v1.0.7-vc7-production-signing-inputs" --dir signing-input
          test -f signing-input/DraBornPark-v1.0.7-vc7-production-unsigned.aab
          test -f signing-input/BUILD_INFO.txt

      - name: Validate permanent DraBornPark upload key
        shell: bash
        run: |
          set -euo pipefail
          for DKD_SECRET_NAME in DKD_ANDROID_KEYSTORE_BASE64 DKD_ANDROID_KEYSTORE_PASSWORD DKD_ANDROID_KEY_ALIAS DKD_ANDROID_KEY_PASSWORD; do
            if [ -z "${!DKD_SECRET_NAME:-}" ]; then
              echo "Required Android signing secret is unavailable: $DKD_SECRET_NAME" >&2
              exit 1
            fi
          done
          printf '%s' "$DKD_ANDROID_KEYSTORE_BASE64" | base64 --decode > dkd_drabornpark_upload.jks
          test -s dkd_drabornpark_upload.jks
          DKD_CERT_SHA256="$(keytool -list -v -keystore dkd_drabornpark_upload.jks -storepass "$DKD_ANDROID_KEYSTORE_PASSWORD" -alias "$DKD_ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr '[:lower:]' '[:upper:]')"
          if [ "$DKD_CERT_SHA256" != "$DKD_EXPECTED_CERT_SHA256" ]; then
            echo "Configured key is not the permanent DraBornPark Google Play upload key." >&2
            echo "Expected certificate: $DKD_EXPECTED_CERT_SHA256" >&2
            echo "Configured certificate: ${DKD_CERT_SHA256:-unavailable}" >&2
            exit 1
          fi
          echo "Permanent DraBornPark upload certificate verified."

      - name: Sign v1.0.7 AAB exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed-output
          DKD_UNSIGNED="signing-input/DraBornPark-v1.0.7-vc7-production-unsigned.aab"
          DKD_SIGNED="signed-output/DraBornPark-v1.0.7-vc7-GooglePlay-release.aab"
          if unzip -Z1 "$DKD_UNSIGNED" | grep -E '^META-INF/.*\.(SF|RSA|DSA|EC)$'; then
            echo "Unsigned source unexpectedly contains a JAR signature." >&2
            exit 1
          fi
          cp "$DKD_UNSIGNED" "$DKD_SIGNED"
          jarsigner -keystore dkd_drabornpark_upload.jks -storepass "$DKD_ANDROID_KEYSTORE_PASSWORD" -keypass "$DKD_ANDROID_KEY_PASSWORD" -sigalg SHA384withRSA -digestalg SHA-256 "$DKD_SIGNED" "$DKD_ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$DKD_SIGNED" | tee signed-output/JARSIGNER_VERIFY.txt
          grep -q 'jar verified.' signed-output/JARSIGNER_VERIFY.txt
          DKD_SIG_COUNT="$(unzip -Z1 "$DKD_SIGNED" | grep -Ec '^META-INF/.*\.SF$')"
          test "$DKD_SIG_COUNT" -eq 1
          sha256sum "$DKD_SIGNED" | tee signed-output/SHA256SUMS.txt
          cat > signed-output/VERIFY.txt <<EOF
          DraBornPark v1.0.7 / versionCode 7 — Google Play Signed Release
          Package: com.draborneagle.drabornpark
          Upload certificate SHA-256: $DKD_EXPECTED_CERT_SHA256
          Signature algorithm: SHA384withRSA
          Digest algorithm: SHA-256
          JAR signature blocks: $DKD_SIG_COUNT
          jarsigner verification: PASS
          Source workflow run: $DKD_SOURCE_RUN_ID
          FINAL RESULT: PASS
          EOF
          rm -f dkd_drabornpark_upload.jks

      - name: Upload signed Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0.7-vc7-GooglePlay-signed
          path: signed-output/
          if-no-files-found: error
          retention-days: 14
