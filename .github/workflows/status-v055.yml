name: DraBornPark v0.5.5 Status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/status-v055.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Read finalizer status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/finalize-v055.yml/runs?per_page=5" --jq '.workflow_runs[] | [.id,.status,.conclusion,.head_sha,.created_at] | @tsv' > .github/V055_FINALIZER_STATUS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/V055_FINALIZER_STATUS.txt
          git commit -m "ci(v0.5.5): snapshot finalizer status"
          git push origin HEAD:main
