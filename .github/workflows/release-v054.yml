name: Release DraBornPark v0.5.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/apply-v054.mjs
      - .github/workflows/release-v054.yml

permissions:
  contents: write

concurrency:
  group: drabornpark-v054-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: apply
        name: Apply guarded v0.5.4 source changes
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/apply-v054.mjs 2>&1 | tee /tmp/v054-apply.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: install
        name: Install exact dependencies
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund 2>&1 | tee /tmp/v054-install.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: integrity
        name: Integrity audit
        if: steps.apply.outcome == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/v054-integrity.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: expo
        name: Expo dependency compatibility
        if: steps.integrity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx expo install --check 2>&1 | tee /tmp/v054-expo.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: types
        name: TypeScript
        if: steps.expo.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee /tmp/v054-types.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - id: web
        name: Expo web export
        if: steps.types.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx expo export --platform web 2>&1 | tee /tmp/v054-web.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Commit validated v0.5.4
        if: steps.apply.outcome == 'success' && steps.install.outcome == 'success' && steps.integrity.outcome == 'success' && steps.expo.outcome == 'success' && steps.types.outcome == 'success' && steps.web.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "DraBornPark v0.5.4: support, permissions and Google Play Plus"
          git push origin HEAD:main
      - name: Publish failure diagnostic
        if: steps.apply.outcome != 'success' || steps.install.outcome == 'failure' || steps.integrity.outcome == 'failure' || steps.expo.outcome == 'failure' || steps.types.outcome == 'failure' || steps.web.outcome == 'failure'
        shell: bash
        run: |
          git reset --hard HEAD
          {
            echo "DraBornPark v0.5.4 release validation failed."
            echo "apply=${{ steps.apply.outcome }} code=${{ steps.apply.outputs.code }}"
            echo "install=${{ steps.install.outcome }} code=${{ steps.install.outputs.code }}"
            echo "integrity=${{ steps.integrity.outcome }} code=${{ steps.integrity.outputs.code }}"
            echo "expo=${{ steps.expo.outcome }} code=${{ steps.expo.outputs.code }}"
            echo "types=${{ steps.types.outcome }} code=${{ steps.types.outputs.code }}"
            echo "web=${{ steps.web.outcome }} code=${{ steps.web.outputs.code }}"
            echo
            for f in /tmp/v054-apply.log /tmp/v054-install.log /tmp/v054-integrity.log /tmp/v054-expo.log /tmp/v054-types.log /tmp/v054-web.log; do
              if [ -f "$f" ]; then echo "===== $f ====="; tail -n 160 "$f"; echo; fi
            done
          } > .github/V054_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/V054_FAILURE.txt
          git commit -m "ci(v0.5.4): record release validation failure"
          git push origin HEAD:main
          exit 1
