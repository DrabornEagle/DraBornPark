name: DraBornPark CI

on:
  workflow_dispatch:
  push:
    branches: [main, feature/**, feat/**, build/**, fix/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: drabornpark-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npx expo export --platform web
      - run: git diff --exit-code -- .

  android-developer-apk:
    name: Android Developer APK
    needs: expo-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android
      - name: Verify Developer APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$APK"
          "$AAPT" dump badging "$APK" | grep "package: name='com.draborneagle.drabornpark'"
          "$AAPT" dump badging "$APK" | grep "versionCode='1'"
          "$AAPT" dump badging "$APK" | grep "versionName='1.0.0'"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DraBornPark-v1.0-vc1-developer-debug.apk
          sha256sum artifacts/*.apk > artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0-vc1-developer-apk
          path: artifacts/
          retention-days: 14
