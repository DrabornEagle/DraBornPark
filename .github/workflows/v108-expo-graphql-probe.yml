name: DraBornPark v1.0.8 Expo GraphQL Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/V108_EXPO_GRAPHQL_TRIGGER'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Query Expo GraphQL by full project name
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/dkd-query.json <<'JSON'
          {"query":"query AppByFullNameQuery($fullName: String!) { app { byFullName(fullName: $fullName) { id name slug ownerAccount { name } } } }","variables":{"fullName":"@draborneagle/drabornpark"}}
          JSON
          dkd_status="$(curl -sS -o /tmp/dkd-expo.json -w '%{http_code}' -H 'content-type: application/json' --data-binary @/tmp/dkd-query.json https://api.expo.dev/graphql || true)"
          echo "Expo GraphQL HTTP status: ${dkd_status}"
          cat /tmp/dkd-expo.json || true
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('/tmp/dkd-expo.json','utf8');
          let payload;try{payload=JSON.parse(text)}catch{throw new Error('Expo GraphQL response was not JSON');}
          const app=payload?.data?.app?.byFullName;
          const id=app?.id;
          const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          if(!id||!uuid.test(id))throw new Error('Expo GraphQL did not expose the DraBornPark project ID without authentication.');
          if(String(app?.slug||'').toLowerCase()!=='drabornpark')throw new Error('Resolved Expo slug mismatch.');
          if(String(app?.ownerAccount?.name||'').toLowerCase()!=='draborneagle')throw new Error('Resolved Expo owner mismatch.');
          fs.writeFileSync('/tmp/dkd-eas-project-id',id+'\n');
          console.log('Resolved Expo EAS Project ID:',id);
          NODE
      - name: Link resolved EAS project ID to app config
        shell: bash
        run: |
          set -euo pipefail
          export DKD_EAS_PROJECT_ID="$(cat /tmp/dkd-eas-project-id)"
          node <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          const id=process.env.DKD_EAS_PROJECT_ID;
          app.expo.owner='draborneagle';
          app.expo.extra={...(app.expo.extra||{}),eas:{...((app.expo.extra||{}).eas||{}),projectId:id}};
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          fs.writeFileSync('.github/EAS_PROJECT_INFO.txt',`DraBornPark EAS Project\nOwner: draborneagle\nSlug: drabornpark\nProject ID: ${id}\n`);
          NODE
      - name: Validate project after link
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run typecheck
          npx expo prebuild --platform android --clean --no-install
          test -f android/app/google-services.json
          node -e "const a=require('./app.json');if(!a.expo.extra?.eas?.projectId)process.exit(1)"
      - name: Commit resolved Expo project link
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DrabornEagle Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.json .github/EAS_PROJECT_INFO.txt
          git commit -m 'chore(v1.0.8): attach DraBornPark Expo project ID' || exit 0
          git push origin HEAD:main
