name: DraBornPark v1.0.6 Release Credential Check

on:
  push:
    branches: [main]
    paths:
      - '.github/V106_CREDENTIAL_CHECK_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check credential availability without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p credential-check
          dkd_present(){ if [ -n "${!1:-}" ]; then echo PRESENT; else echo MISSING; fi; }
          {
            echo "DraBornPark v1.0.6 release credential status"
            echo "EXPO_PUBLIC_EAS_PROJECT_ID=$(dkd_present EXPO_PUBLIC_EAS_PROJECT_ID)"
            echo "EXPO_TOKEN=$(dkd_present EXPO_TOKEN)"
            echo "DKD_ANDROID_KEYSTORE_BASE64=$(dkd_present DKD_ANDROID_KEYSTORE_BASE64)"
            echo "DKD_ANDROID_KEYSTORE_PASSWORD=$(dkd_present DKD_ANDROID_KEYSTORE_PASSWORD)"
            echo "DKD_ANDROID_KEY_ALIAS=$(dkd_present DKD_ANDROID_KEY_ALIAS)"
            echo "DKD_ANDROID_KEY_PASSWORD=$(dkd_present DKD_ANDROID_KEY_PASSWORD)"
          } | tee credential-check/CREDENTIAL_STATUS.txt
          if [ -n "${DKD_ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${DKD_ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${DKD_ANDROID_KEY_ALIAS:-}" ]; then
            printf '%s' "$DKD_ANDROID_KEYSTORE_BASE64" | base64 --decode > credential-check/dkd_key.jks
            dkd_cert="$(keytool -list -v -keystore credential-check/dkd_key.jks -storepass "$DKD_ANDROID_KEYSTORE_PASSWORD" -alias "$DKD_ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr '[:lower:]' '[:upper:]')"
            echo "ANDROID_UPLOAD_CERT_SHA256=${dkd_cert:-UNAVAILABLE}" | tee -a credential-check/CREDENTIAL_STATUS.txt
            rm -f credential-check/dkd_key.jks
          fi
      - name: Upload diagnostic status
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0.6-release-credential-status
          path: credential-check/CREDENTIAL_STATUS.txt
          retention-days: 2
