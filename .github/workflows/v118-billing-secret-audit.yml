name: DraBornPark v1.0.18 Billing Secret Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/V118_BILLING_AUDIT_TRIGGER'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check required secret presence
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in GOOGLE_PLAY_SERVICE_ACCOUNT_JSON GOOGLE_PLAY_SERVICE_ACCOUNT GOOGLE_PLAY_SERVICE_ACCOUNT_KEY PLAY_SERVICE_ACCOUNT_JSON GOOGLE_SERVICE_ACCOUNT_JSON SUPABASE_ACCESS_TOKEN; do
            if [ -n "${!name:-}" ]; then echo "$name=SET"; else echo "$name=EMPTY"; fi
          done
