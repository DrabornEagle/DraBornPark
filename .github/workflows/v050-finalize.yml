name: DraBornPark v0.5.0 Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v050-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble and apply v0.5.0 source finalizer
        run: |
          cat scripts/.v050.part1 scripts/.v050.part2 scripts/.v050.part3 scripts/.v050.part4 scripts/.v050.part5 > /tmp/v050-finalize.mjs
          node --check /tmp/v050-finalize.mjs
          node /tmp/v050-finalize.mjs

      - name: Remove temporary release machinery
        run: |
          rm -f scripts/.v050.part1 scripts/.v050.part2 scripts/.v050.part3 scripts/.v050.part4 scripts/.v050.part5
          rm -f .github/workflows/v050-finalize.yml

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Project integrity
        run: npm run check

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: TypeScript
        run: npm run typecheck

      - name: Web export
        run: npx expo export --platform web

      - name: Commit v0.5.0
        run: |
          git config user.name 'DraBornPark Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'feat: release DraBornPark v0.5.0'
          git push origin HEAD:main
