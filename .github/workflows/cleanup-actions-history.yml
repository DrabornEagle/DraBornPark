name: Purge Failed Actions History

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-actions-history.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Delete every failed or cancelled workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.status=="completed" and (.conclusion=="failure" or .conclusion=="cancelled")) | .id' \
            | sort -u > /tmp/bad-runs.txt
          total=$(wc -l < /tmp/bad-runs.txt | tr -d ' ')
          deleted=0
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"; then
              deleted=$((deleted+1))
            fi
          done < /tmp/bad-runs.txt
          printf 'Scanned failed/cancelled: %s\nDeleted: %s\nCurrent cleanup run: %s\n' "$total" "$deleted" "$GITHUB_RUN_ID" > .github/ACTIONS_CLEANUP_DONE.txt

      - name: Publish cleanup marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ACTIONS_CLEANUP_DONE.txt
          git commit -m "chore: confirm Actions history cleanup"
          git push origin HEAD:main
