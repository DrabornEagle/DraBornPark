name: DraBornPark v1.0 Finalize

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v100.yml'
      - 'scripts/release-v100.mjs'
      - 'assets/branding/drabornpark-icon.svg'
      - 'assets/branding/drabornpark-mark.svg'

permissions:
  contents: write

concurrency:
  group: drabornpark-v100-finalize
  cancel-in-progress: false

jobs:
  finalize-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Render DraBornPark icon assets
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets/branding
          rsvg-convert -w 1024 -h 1024 assets/branding/drabornpark-icon.svg -o assets/branding/icon.png
          rsvg-convert -w 1024 -h 1024 assets/branding/drabornpark-mark.svg -o assets/branding/adaptive-icon.png
          rsvg-convert -w 1024 -h 1024 assets/branding/drabornpark-mark.svg -o assets/branding/monochrome-icon.png
          rsvg-convert -w 1024 -h 1024 assets/branding/drabornpark-mark.svg -o assets/branding/splash-icon.png
          file assets/branding/*.png

      - name: Apply v1.0 release source
        run: node scripts/release-v100.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release source
        run: |
          npm run check
          npx expo install --check
          npm run typecheck
          git diff --check

      - name: Commit v1.0 source to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json package.json package-lock.json README.md .github/VERSION .github/workflows/ci.yml \
            app/index.tsx app/hub.tsx app/legal.tsx scripts/check-project.mjs \
            assets/branding/icon.png assets/branding/adaptive-icon.png assets/branding/monochrome-icon.png assets/branding/splash-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "release: DraBornPark v1.0 vc1 Play Store candidate"
            git push origin HEAD:main
          fi

      - name: Expo web production export
        run: npx expo export --platform web

      - name: Generate Android release project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Create one-time Play upload signing identity
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -hex 28)"
          KEY_PASS="$STORE_PASS"
          KEY_ALIAS="drabornpark_upload_v1"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          KEYSTORE="$GITHUB_WORKSPACE/android/app/drabornpark-upload-v1.jks"
          keytool -genkeypair -v -storetype JKS -keystore "$KEYSTORE" -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -dname "CN=DraBornPark Upload, OU=Android Release, O=DraBornPark, L=Ankara, ST=Ankara, C=TR"
          echo "DRABORNPARK_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "DRABORNPARK_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "DRABORNPARK_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          echo "DRABORNPARK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // DraBornPark v1.0 Play Store release signing override.
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("DRABORNPARK_KEYSTORE"))
                      storePassword System.getenv("DRABORNPARK_STORE_PASS")
                      keyAlias System.getenv("DRABORNPARK_KEY_ALIAS")
                      keyPassword System.getenv("DRABORNPARK_KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          CI: '1'
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify release signatures and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep "package: name='com.draborneagle.drabornpark'"
          "$AAPT" dump badging "$APK" | grep "versionCode='1'"
          "$AAPT" dump badging "$APK" | grep "versionName='1.0.0'"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          jarsigner -verify -verbose -certs "$AAB" >/tmp/aab-signature.txt
          grep -E "Signer #1 certificate SHA-256 digest|Verified" /tmp/apk-signature.txt || true

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/DraBornPark-v1.0-vc1-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/DraBornPark-v1.0-vc1-release.aab
          sha256sum artifacts/DraBornPark-v1.0-vc1-release.apk artifacts/DraBornPark-v1.0-vc1-release.aab > artifacts/SHA256SUMS.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs artifacts/DraBornPark-v1.0-vc1-release.apk > artifacts/SIGNATURE.txt
          printf 'DraBornPark v1.0\nVersion name: 1.0.0\nAndroid versionCode: 1\nPackage: com.draborneagle.drabornpark\nBuild: signed release APK + signed release AAB\nCommit: %s\nIcon: custom DraBornPark temporary brand icon\nSplash: native dark brand splash -> animated in-app Loading\n' "$GITHUB_SHA" > artifacts/BUILD_INFO.txt

      - name: Upload signed Play Store candidate
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0-vc1-signed-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
