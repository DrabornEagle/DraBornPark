name: DraBornPark v0.5.5 Preflight

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/preflight-v055.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v0.5.5 patch
        id: apply
        shell: bash
        run: |
          set +e
          node scripts/fix-v055-stage.mjs > /tmp/fix.log 2>&1
          fix_code=$?
          if [ "$fix_code" -eq 0 ]; then node scripts/apply-v055.mjs > /tmp/apply.log 2>&1; apply_code=$?; else apply_code=99; fi
          echo "fix_code=$fix_code" >> "$GITHUB_OUTPUT"
          echo "apply_code=$apply_code" >> "$GITHUB_OUTPUT"
          test "$fix_code" -eq 0 -a "$apply_code" -eq 0
      - name: Install
        id: install
        if: success()
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund > /tmp/install.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Integrity
        id: integrity
        if: success()
        shell: bash
        run: |
          set +e
          npm run check > /tmp/check.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Types
        id: types
        if: success()
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/types.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Web
        id: web
        if: success()
        shell: bash
        run: |
          set +e
          npx expo export --platform web > /tmp/web.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Publish result marker
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          {
            echo "v0.5.5 preflight"
            echo "apply=${{ steps.apply.outcome }} fix=${{ steps.apply.outputs.fix_code }} patch=${{ steps.apply.outputs.apply_code }}"
            echo "install=${{ steps.install.outcome }} code=${{ steps.install.outputs.code }}"
            echo "integrity=${{ steps.integrity.outcome }} code=${{ steps.integrity.outputs.code }}"
            echo "types=${{ steps.types.outcome }} code=${{ steps.types.outputs.code }}"
            echo "web=${{ steps.web.outcome }} code=${{ steps.web.outputs.code }}"
            for f in /tmp/fix.log /tmp/apply.log /tmp/install.log /tmp/check.log /tmp/types.log /tmp/web.log; do
              if [ -f "$f" ]; then echo; echo "===== $f ====="; tail -n 120 "$f"; fi
            done
          } > .github/V055_PREFLIGHT.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/V055_PREFLIGHT.txt
          git commit -m "ci(v0.5.5): record preflight result"
          git push origin HEAD:main
          if [ "${{ steps.web.outcome }}" != "success" ]; then exit 1; fi
