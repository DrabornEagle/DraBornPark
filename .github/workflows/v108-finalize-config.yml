name: DraBornPark v1.0.8 Config Finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/V108_FINALIZE_CONFIG_TRIGGER'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize v1.0.8 metadata and cloud function channels
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version='1.0.8';
          if(lock.packages?.['']) lock.packages[''].version='1.0.8';
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          const patches=[
            ['supabase/functions/drabornpark-public-contact/index.ts',[[/const VERSION="[^"]+";/,'const VERSION="1.0.8";'],[/const PUSH_CHANNEL="[^"]+";/,'const PUSH_CHANNEL="drabornpark-alerts-v4";']]],
            ['supabase/functions/drabornpark-call-request/index.ts',[[/const VERSION="[^"]+";/,'const VERSION="1.0.8";'],[/const PUSH_CHANNEL="[^"]+";/,'const PUSH_CHANNEL="drabornpark-alerts-v4";']]],
            ['supabase/functions/dkd-drabornpark-google-play/index.ts',[[/const VERSION="[^"]+";/,'const VERSION="1.0.8";']]],
          ];
          for(const [file,replacements] of patches){let text=fs.readFileSync(file,'utf8');for(const [from,to] of replacements)text=text.replace(from,to);fs.writeFileSync(file,text);}
          NODE
          node -e "const a=require('./app.json');const f=require('./google-services.json');if(a.expo.version!=='1.0.8'||a.expo.android.versionCode!==8||a.expo.android.googleServicesFile!=='./google-services.json'||f.project_info.project_id!=='drabornpark')process.exit(1)"
          grep -F 'const VERSION="1.0.8";' supabase/functions/drabornpark-public-contact/index.ts
          grep -F 'const PUSH_CHANNEL="drabornpark-alerts-v4";' supabase/functions/drabornpark-public-contact/index.ts
          grep -F 'const VERSION="1.0.8";' supabase/functions/drabornpark-call-request/index.ts
          grep -F 'const PUSH_CHANNEL="drabornpark-alerts-v4";' supabase/functions/drabornpark-call-request/index.ts
          grep -F 'const VERSION="1.0.8";' supabase/functions/dkd-drabornpark-google-play/index.ts
      - name: Commit normalized files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'DrabornEagle Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json supabase/functions/drabornpark-public-contact/index.ts supabase/functions/drabornpark-call-request/index.ts supabase/functions/dkd-drabornpark-google-play/index.ts
          git commit -m 'chore(v1.0.8): normalize Firebase push and Play backend metadata'
          git push origin HEAD:main
