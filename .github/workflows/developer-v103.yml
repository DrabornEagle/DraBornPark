name: DraBornPark v1.0.3 Developer APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/DEVELOPER_V103_TRIGGER'
  pull_request:
    branches: [main]
    paths:
      - '.github/DEVELOPER_V103_TRIGGER'

permissions:
  contents: read

concurrency:
  group: drabornpark-v103-developer-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build-developer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install production dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate production source before developer injection
        run: |
          npm run check
          npx expo install --check
          npm run typecheck
      - name: Inject expo-dev-client only for this temporary developer build
        run: npx expo install expo-dev-client
      - name: Generate Android developer project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build Developer APK
        working-directory: android
        env:
          CI: '1'
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Verify Developer APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APK" && test -f "$APK"
          "$AAPT" dump badging "$APK" | grep "package: name='com.draborneagle.drabornpark'"
          "$AAPT" dump badging "$APK" | grep "versionCode='3'"
          "$AAPT" dump badging "$APK" | grep "versionName='1.0.3'"
          grep -R -F 'expo.modules.devclient' android/app/src/main || true
          mkdir -p developer-output
          cp "$APK" developer-output/DraBornPark-v1.0.3-vc3-Developer.apk
          sha256sum developer-output/*.apk > developer-output/SHA256SUMS.txt
          cat > developer-output/BUILD_INFO.txt <<'EOF'
          DraBornPark v1.0.3 Developer APK
          Android versionCode: 3
          Package: com.draborneagle.drabornpark
          expo-dev-client: injected only inside CI developer build
          Production package.json remains expo-dev-client free.
          EOF
      - name: Upload Developer APK
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0.3-vc3-Developer
          path: developer-output/
          if-no-files-found: error
          retention-days: 14
