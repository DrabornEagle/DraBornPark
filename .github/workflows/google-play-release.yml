name: DraBornPark v1.0.8 Google Play Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/RELEASE_V108_TRIGGER'

permissions:
  contents: read

concurrency:
  group: drabornpark-google-play-release-v108-final-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install locked dependencies
        env:
          CI: '1'
        run: npm ci --no-audit --no-fund

      - name: Verify v1.0.8 source, Firebase and EAS identity
        env:
          CI: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx expo install --check
          npm run typecheck
          git diff --check
          ! grep -q 'expo-dev-client' package.json
          ! grep -q 'expo-dev-client' app.json
          node <<'NODE'
          const fs=require('fs');
          const app=JSON.parse(fs.readFileSync('app.json','utf8')).expo;
          if(app.version!=='1.0.8') throw new Error('versionName must be 1.0.8');
          if(app.android?.versionCode!==8) throw new Error('versionCode must be 8');
          if(app.android?.package!=='com.draborneagle.drabornpark') throw new Error('Android package mismatch');
          if(app.owner!=='draborneagle') throw new Error('Expo owner mismatch');
          if(app.extra?.eas?.projectId!=='db4ce418-3c4a-4323-9a1f-e39614b64e27') throw new Error('EAS projectId mismatch');
          if(app.android?.googleServicesFile!=='./google-services.json') throw new Error('googleServicesFile mismatch');
          const firebase=JSON.parse(fs.readFileSync('google-services.json','utf8'));
          if(firebase.project_info?.project_id!=='drabornpark') throw new Error('Firebase project mismatch');
          const packages=(firebase.client||[]).map(x=>x?.client_info?.android_client_info?.package_name);
          if(!packages.includes('com.draborneagle.drabornpark')) throw new Error('Firebase Android client mismatch');
          console.log('v1.0.8 Firebase/EAS identity verified.');
          NODE

      - name: Generate clean Android production project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated production manifest and Firebase config
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          test -f android/app/google-services.json
          grep -F 'www.draborneagle.com' "$MANIFEST"
          grep -F '/DraBornPark/tag/' "$MANIFEST"
          grep -F 'com.draborneagle.drabornpark' android/app/google-services.json
          if grep -F '/DraBornPark/t/' "$MANIFEST"; then echo 'Legacy long /t/ App Link unexpectedly present' >&2; exit 1; fi
          if grep -R -F 'exp+drabornpark' android/app/src/main; then echo 'Development exp+drabornpark scheme unexpectedly present' >&2; exit 1; fi
          if grep -R -F 'expo.modules.devclient' android/app/src/main; then echo 'Expo dev client marker unexpectedly present' >&2; exit 1; fi

      - name: Build production APK and AAB for secure signing
        working-directory: android
        env:
          CI: '1'
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify production package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          AAB="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APK" && test -f "$APK"
          test -n "$AAB" && test -f "$AAB"
          "$AAPT" dump badging "$APK" | grep "package: name='com.draborneagle.drabornpark'"
          "$AAPT" dump badging "$APK" | grep "versionCode='8'"
          "$AAPT" dump badging "$APK" | grep "versionName='1.0.8'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F '/DraBornPark/tag/'
          "$AAPT" dump permissions "$APK" | grep -F 'android.permission.POST_NOTIFICATIONS'
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F '/DraBornPark/t/'; then echo 'Legacy long /t/ App Link present' >&2; exit 1; fi
          if "$AAPT" dump permissions "$APK" | grep -F 'android.permission.SYSTEM_ALERT_WINDOW'; then echo 'SYSTEM_ALERT_WINDOW present' >&2; exit 1; fi
          if "$AAPT" dump permissions "$APK" | grep -F 'android.permission.RECORD_AUDIO'; then echo 'RECORD_AUDIO present' >&2; exit 1; fi
          if "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'exp+drabornpark'; then echo 'Development scheme present' >&2; exit 1; fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "AAB=$AAB" >> "$GITHUB_ENV"

      - name: Prepare clean secure-signing inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cp "$APK" release-output/DraBornPark-v1.0.8-vc8-production.apk
          cp "$AAB" release-output/DraBornPark-v1.0.8-vc8-production-unsigned.aab
          zip -q -d release-output/DraBornPark-v1.0.8-vc8-production-unsigned.aab \
            'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          if unzip -Z1 release-output/DraBornPark-v1.0.8-vc8-production-unsigned.aab | grep -E '^META-INF/.*\.(SF|RSA|DSA|EC)$|^META-INF/MANIFEST\.MF$'; then
            echo 'AAB signature cleanup failed' >&2
            exit 1
          fi
          sha256sum release-output/* > release-output/SHA256SUMS.txt
          cat > release-output/BUILD_INFO.txt <<'EOF'
          DraBornPark Google Play production signing input
          Version name: 1.0.8
          Android versionCode: 8
          Package: com.draborneagle.drabornpark
          Expo EAS Project ID: db4ce418-3c4a-4323-9a1f-e39614b64e27
          Firebase project: drabornpark
          FCM channel: drabornpark-alerts-v4
          Expo SDK: 57
          expo-dev-client: absent
          POST_NOTIFICATIONS: verified present
          SYSTEM_ALERT_WINDOW: verified absent
          RECORD_AUDIO: verified absent
          Canonical Android App Link: https://www.draborneagle.com/DraBornPark/tag/*
          Existing AAB JAR signatures: stripped before external signing
          Expected upload certificate SHA-256: 95:4C:F9:A8:E0:DB:09:46:A2:63:18:D6:95:7B:DF:0B:72:2D:51:7B:40:67:67:F8:3E:4C:37:BE:84:67:6B:C6
          Final AAB must be signed exactly once with the permanent DraBornPark upload key and verified before distribution.
          EOF

      - name: Upload production secure-signing inputs
        uses: actions/upload-artifact@v4
        with:
          name: DraBornPark-v1.0.8-vc8-production-signing-inputs
          path: release-output/
          if-no-files-found: error
          retention-days: 14
