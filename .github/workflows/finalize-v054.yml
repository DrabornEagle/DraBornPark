name: Finalize DraBornPark v0.5.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v054.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drabornpark-v054-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply validated v0.5.4 source
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-v054.mjs
          node scripts/fix-v054-type.mjs
          node scripts/fix-v054-worklets.mjs
          npm install --no-audit --no-fund

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx expo install --check
          npm run typecheck
          npx expo export --platform web

      - name: Prepare clean source commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows
          rm -f .github/V054_FAILURE.txt .github/V054_RUN_STATUS.json
          rm -rf .github/v054-source .github/v054-payload
          rm -f scripts/apply-v054.mjs scripts/release-v054.mjs scripts/fix-v054-type.mjs scripts/fix-v054-worklets.mjs
          rm -rf dist android artifacts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to publish."
          else
            git commit -m "DraBornPark v0.5.4: publish validated final source"
            git push origin HEAD:main
          fi

      - name: Clean failed and cancelled workflow history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --limit 100 --json databaseId,status,conclusion --jq '.[] | select(.status=="completed" and (.conclusion=="failure" or .conclusion=="cancelled")) | .databaseId' > /tmp/bad-runs.txt
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            [ "$run_id" = "$GITHUB_RUN_ID" ] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" || true
          done < /tmp/bad-runs.txt

      - name: Final source markers
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:package.json | grep '"version": "0.5.4"'
          git show origin/main:app.json | grep '"version": "0.5.4"'
          git show origin/main:.github/VERSION | grep '^0.5.4$'
          echo "DraBornPark v0.5.4 final source published and failed/cancelled workflow history cleaned."
